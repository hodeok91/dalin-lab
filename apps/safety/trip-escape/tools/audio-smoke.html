<!doctype html><html lang="ko"><meta charset="utf-8"><base href="../"><title>효과음 실제 브라우저 확인</title><script src="sound.js"></script><style>body{font:22px/1.7 system-ui;padding:35px}button{font:inherit;padding:15px;margin:10px}pre{white-space:pre-wrap}</style><h1>효과음 실제 브라우저 확인</h1><p>학습 앱과 같은 sound.js를 실제 Web Audio API로 실행합니다.</p><button id="play">발견 효과음</button><button id="mute">효과음 끄고 시험</button><button id="music">공원 배경음</button><pre id="status">대기</pre><script>
const a=SafetyAudio.create();let events=[];const status=document.getElementById('status');function show(){status.textContent=JSON.stringify({state:a.state(),events},null,2);status.dataset.music=String(events.some(e=>e.type==='music'));status.dataset.effect=events.at(-1)?.effect||'';status.dataset.muted=String(!a.state().effects);}
document.addEventListener('safety-audio',e=>{events.push(e.detail);show();});document.getElementById('play').onclick=()=>{a.configure({effects:true,music:false});a.unlock();a.play('found');show();};document.getElementById('mute').onclick=()=>{a.configure({effects:false,music:false});a.play('bad');show();};document.getElementById('music').onclick=()=>{a.configure({effects:true,music:true});a.unlock();a.setScene({place:'park',active:true});show();};window.addEventListener('pagehide',()=>a.destroy());
</script></html>
